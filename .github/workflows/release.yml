name: release

# On a version tag (v1.2.3): build the VS Code extension and attach it to the GitHub release,
# creating the release with generated notes if it does not exist yet.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Package the extension
        working-directory: vscode
        run: |
          node build.mjs
          npx -y @vscode/vsce@3 package --allow-missing-repository -o "compact-xray-${GITHUB_REF_NAME#v}.vsix"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --title "Compact X-Ray $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" vscode/*.vsix --clobber
